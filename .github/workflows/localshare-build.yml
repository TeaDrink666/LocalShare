name: LocalShare Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build arm64-v8a APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Android-Release
          if-no-files-found: error
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows Release Packages
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: Add Visual C++ runtime files
        working-directory: app
        shell: pwsh
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Package Windows bundle
        working-directory: app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalShare-windows-x64-release.zip

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc scripts/compile_localshare_setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows-Release
          if-no-files-found: error
          path: |
            app/LocalShare-windows-x64-release.zip
            dist/LocalShare-Setup-*-x64.exe
