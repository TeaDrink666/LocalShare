name: LocalShare Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    name: Android Release APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build arm64-v8a and x86_64 APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --no-pub

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Android-Release
          if-no-files-found: error
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    name: Windows Release Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: Add Visual C++ runtime files
        working-directory: app
        shell: pwsh
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Package Windows bundle
        working-directory: app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LocalShare-windows-x64-release.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: LocalShare-Windows-Release
          if-no-files-found: error
          path: app/LocalShare-windows-x64-release.zip
