name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Check changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "$BASE_SHA" ]]; then
            echo "No base commit is available; skipping the incremental format check."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
              'app/lib/**/*.dart' 'app/test/**/*.dart' \
              'common/lib/**/*.dart' 'common/test/**/*.dart'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed."
            exit 0
          fi

          printf 'Checking %s\n' "${dart_files[@]}"
          dart format --line-length 150 --output=none --set-exit-if-changed "${dart_files[@]}"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get
      - name: Analyze (app)
        working-directory: app
        run: flutter analyze
      - name: Test (app)
        working-directory: app
        run: flutter test

      - name: Dependencies (common)
        working-directory: common
        run: dart pub get
      - name: Analyze (common)
        working-directory: common
        run: dart analyze
      - name: Test (common)
        working-directory: common
        run: dart test

  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Extract version from pubspec.yaml
        id: pubspec_version
        run: |
          VERSION=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | sed 's/+/. /' | tr -d ' ')
          echo "Pubspec version is $VERSION"
          echo "pubspec_version=$VERSION" >> $GITHUB_ENV

      - name: Extract version from Inno Setup configuration
        id: inno_version
        run: |
          VERSION=$(grep '#define MyAppVersion ' scripts/compile_localshare_setup.iss | sed 's/#define MyAppVersion "//' | sed 's/"//')
          echo "Inno Setup version is $VERSION"
          echo "inno_version=$VERSION" >> $GITHUB_ENV

      - name: Compare pubspec and Inno Setup versions
        run: |
          if [ "$pubspec_version" != "$inno_version" ]; then
            echo "Version mismatch detected!"
            exit 1
          else
            echo "Versions match."
          fi
