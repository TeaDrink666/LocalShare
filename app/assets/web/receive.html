<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>Send to LocalShare</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #0f766e;
            --primary-bright: #16a394;
            --secondary: #5965a8;
            --text: #18212c;
            --muted: #64707d;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-solid: #ffffff;
            --surface-soft: rgba(244, 248, 250, 0.78);
            --border: rgba(113, 123, 133, 0.2);
            --page-a: #e9faf6;
            --page-b: #eef1ff;
            --danger: #b64343;
            --danger-soft: rgba(182, 67, 67, 0.1);
            --success: #0f766e;
            --success-soft: rgba(15, 118, 110, 0.1);
            --shadow: 0 24px 70px rgba(31, 54, 71, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #f5f8fb;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(circle at 8% 5%, var(--page-a) 0, transparent 34rem),
                radial-gradient(circle at 92% 10%, var(--page-b) 0, transparent 32rem),
                #f7f9fc;
        }

        button {
            color: inherit;
            font: inherit;
        }

        .page-shell {
            width: min(100% - 32px, 980px);
            margin: 0 auto;
            padding: max(28px, env(safe-area-inset-top)) 0 max(40px, env(safe-area-inset-bottom));
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 4px 24px;
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -0.35px;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 14px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 9px 24px rgba(15, 118, 110, 0.23);
        }

        .brand-mark svg {
            width: 22px;
            height: 22px;
        }

        .send-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 34px 36px 32px;
            color: white;
            background: linear-gradient(125deg, #0f766e 0%, #168f82 48%, #5965a8 100%);
        }

        .hero::before,
        .hero::after {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.055);
            content: "";
        }

        .hero::before {
            right: 94px;
            bottom: -120px;
            width: 170px;
            height: 170px;
        }

        .hero::after {
            top: -82px;
            right: -52px;
            width: 230px;
            height: 230px;
        }

        .eyebrow {
            display: inline-flex;
            position: relative;
            z-index: 1;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.11);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a7f3d0;
            box-shadow: 0 0 0 5px rgba(167, 243, 208, 0.14);
        }

        h1 {
            position: relative;
            z-index: 1;
            margin: 21px 0 8px;
            font-size: clamp(30px, 5vw, 44px);
            line-height: 1.08;
            letter-spacing: -1.25px;
        }

        #hero-status {
            position: relative;
            z-index: 1;
            min-height: 24px;
            margin: 0;
            color: rgba(255, 255, 255, 0.78);
            font-size: 16px;
        }

        .content {
            padding: 28px;
        }

        noscript {
            display: block;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            color: #8b2d2d;
            background: #fee2e2;
        }

        .drop-zone {
            position: relative;
            display: grid;
            min-height: 224px;
            place-items: center;
            padding: 30px 22px;
            border: 1.5px dashed rgba(15, 118, 110, 0.36);
            border-radius: 24px;
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.055), rgba(89, 101, 168, 0.05)),
                var(--surface-soft);
            text-align: center;
            cursor: pointer;
            transition: border-color 170ms ease, background 170ms ease, box-shadow 170ms ease, transform 170ms ease;
        }

        .drop-zone:hover,
        .drop-zone:focus-visible,
        .drop-zone.is-dragging {
            border-color: var(--primary-bright);
            outline: none;
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.1), rgba(89, 101, 168, 0.08)),
                var(--surface-soft);
            box-shadow: inset 0 0 0 4px rgba(15, 118, 110, 0.055), 0 14px 35px rgba(15, 118, 110, 0.1);
            transform: translateY(-1px);
        }

        .drop-zone.is-disabled {
            opacity: 0.58;
            cursor: default;
            pointer-events: none;
            transform: none;
        }

        .drop-content {
            max-width: 560px;
        }

        .drop-icon {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            place-items: center;
            border-radius: 21px;
            color: var(--primary);
            background: var(--surface-solid);
            box-shadow: 0 12px 30px rgba(15, 118, 110, 0.13);
        }

        .drop-icon svg {
            width: 29px;
            height: 29px;
        }

        .drop-zone h2 {
            margin: 0;
            font-size: 21px;
            letter-spacing: -0.35px;
        }

        .drop-zone p {
            margin: 8px 0 18px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .picker-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .button {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 17px;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease, border-color 150ms ease;
        }

        .button:hover:not(:disabled),
        .button:focus-visible:not(:disabled) {
            outline: none;
            transform: translateY(-1px);
        }

        .button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .button-primary {
            color: white;
            background: linear-gradient(135deg, var(--primary), #148d82);
            box-shadow: 0 9px 22px rgba(15, 118, 110, 0.2);
        }

        .button-primary:hover:not(:disabled),
        .button-primary:focus-visible:not(:disabled) {
            box-shadow: 0 12px 28px rgba(15, 118, 110, 0.28);
        }

        .button-secondary {
            border-color: var(--border);
            color: var(--text);
            background: var(--surface-solid);
        }

        .button-danger-soft {
            border-color: rgba(182, 67, 67, 0.18);
            color: var(--danger);
            background: var(--danger-soft);
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 26px 4px 13px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: -0.25px;
        }

        #selection-summary {
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
            white-space: nowrap;
        }

        .file-list {
            display: grid;
            max-height: 348px;
            gap: 10px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }

        .file-list:empty {
            display: none;
        }

        .file-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            min-height: 74px;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface-solid);
        }

        .file-icon {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border-radius: 14px;
            color: var(--primary);
            background: var(--success-soft);
        }

        .file-icon svg {
            width: 21px;
            height: 21px;
        }

        .file-main {
            min-width: 0;
            padding: 0 12px;
        }

        .file-line {
            display: flex;
            min-width: 0;
            align-items: baseline;
            gap: 9px;
        }

        .file-name {
            overflow: hidden;
            font-size: 14px;
            font-weight: 680;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            flex: none;
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .file-path {
            overflow: hidden;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-progress {
            height: 3px;
            margin-top: 8px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(100, 112, 125, 0.14);
        }

        .file-progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary-bright), var(--secondary));
            transition: width 120ms linear;
        }

        .file-side {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .file-state {
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
            white-space: nowrap;
        }

        .file-state.is-success {
            color: var(--success);
        }

        .file-state.is-error {
            color: var(--danger);
        }

        .remove-button {
            display: grid;
            width: 32px;
            height: 32px;
            padding: 0;
            place-items: center;
            border: 0;
            border-radius: 10px;
            color: var(--muted);
            background: transparent;
            cursor: pointer;
        }

        .remove-button:hover,
        .remove-button:focus-visible {
            outline: none;
            color: var(--danger);
            background: var(--danger-soft);
        }

        .remove-button svg {
            width: 17px;
            height: 17px;
        }

        .transfer-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 20px;
            margin-top: 22px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 21px;
            background: var(--surface-soft);
        }

        .progress-copy {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #progress-title {
            font-size: 13px;
            font-weight: 720;
        }

        #progress-detail {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .total-progress {
            height: 7px;
            margin-top: 9px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(100, 112, 125, 0.14);
        }

        #total-progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--primary-bright) 56%, var(--secondary));
            transition: width 150ms linear;
        }

        .transfer-actions {
            display: flex;
            gap: 9px;
        }

        .notice {
            display: none;
            margin-top: 13px;
            padding: 12px 14px;
            border: 1px solid rgba(182, 67, 67, 0.16);
            border-radius: 14px;
            color: var(--danger);
            background: var(--danger-soft);
            font-size: 13px;
            line-height: 1.45;
        }

        .notice.is-visible {
            display: block;
        }

        .notice.is-success {
            border-color: rgba(15, 118, 110, 0.16);
            color: var(--success);
            background: var(--success-soft);
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin: 17px 4px 0;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .footer svg {
            flex: none;
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 680px) {
            .page-shell {
                width: min(100% - 20px, 980px);
                padding-top: 18px;
            }

            .brand {
                margin-bottom: 16px;
            }

            .send-card {
                border-radius: 24px;
            }

            .hero {
                padding: 28px 22px 26px;
            }

            .content {
                padding: 18px 14px;
            }

            .drop-zone {
                min-height: 210px;
                padding: 25px 15px;
                border-radius: 20px;
            }

            .file-item {
                grid-template-columns: auto minmax(0, 1fr);
            }

            .file-side {
                grid-column: 2;
                justify-content: space-between;
                padding: 5px 10px 0 12px;
            }

            .transfer-panel {
                grid-template-columns: minmax(0, 1fr);
                gap: 15px;
                padding: 15px;
            }

            .transfer-actions,
            .transfer-actions .button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --text: #e5e9f0;
                --muted: #aab3bd;
                --surface: rgba(20, 27, 35, 0.91);
                --surface-solid: #171e27;
                --surface-soft: rgba(22, 31, 40, 0.82);
                --border: rgba(190, 201, 212, 0.13);
                --page-a: rgba(15, 118, 110, 0.18);
                --page-b: rgba(89, 101, 168, 0.17);
                --danger: #f09a9a;
                --danger-soft: rgba(240, 154, 154, 0.09);
                --success: #73d9cc;
                --success-soft: rgba(115, 217, 204, 0.1);
                --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            }

            html,
            body {
                background-color: #0f151c;
            }

            .drop-icon,
            .file-icon {
                color: #73d9cc;
            }
        }
    </style>
    <script src="/web-receive.js" defer></script>
</head>
<body>
<div class="page-shell">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"></path>
                <path d="m22 2-7 20-4-9-9-4Z"></path>
            </svg>
        </span>
        <span>LocalShare</span>
    </div>

    <main class="send-card">
        <section class="hero">
            <div class="eyebrow"><span class="status-dot"></span> <span data-i18n="eyebrow">Browser upload</span></div>
            <h1 data-i18n="title">Send files to this device</h1>
            <p id="hero-status" aria-live="polite">Choose files or a folder to begin.</p>
        </section>

        <section class="content">
            <noscript>LocalShare requires JavaScript. Please enable it and reload this page.</noscript>

            <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-describedby="drop-help">
                <div class="drop-content">
                    <span class="drop-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 16V4"></path>
                            <path d="m7 9 5-5 5 5"></path>
                            <path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"></path>
                        </svg>
                    </span>
                    <h2 data-i18n="dropTitle">Drop files here</h2>
                    <p id="drop-help" data-i18n="dropHelp">They are sent directly over your local network—nothing is uploaded to the cloud.</p>
                    <div class="picker-actions">
                        <button id="pick-files" class="button button-primary" type="button">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                                <path d="M14 2v6h6"></path>
                            </svg>
                            <span data-i18n="chooseFiles">Choose files</span>
                        </button>
                        <button id="pick-folder" class="button button-secondary" type="button">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
                            </svg>
                            <span data-i18n="chooseFolder">Choose folder</span>
                        </button>
                    </div>
                </div>
            </div>

            <input id="file-input" class="visually-hidden" type="file" multiple tabindex="-1">
            <input id="folder-input" class="visually-hidden" type="file" multiple webkitdirectory directory tabindex="-1">

            <div class="section-heading">
                <h2 data-i18n="selectedFiles">Selected files</h2>
                <span id="selection-summary">0 files · 0 B</span>
            </div>
            <div id="file-list" class="file-list" aria-live="polite"></div>

            <div class="transfer-panel">
                <div>
                    <div class="progress-copy">
                        <span id="progress-title">Ready to send</span>
                        <span id="progress-detail">0%</span>
                    </div>
                    <div class="total-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-title">
                        <div id="total-progress-bar"></div>
                    </div>
                </div>
                <div class="transfer-actions">
                    <button id="new-transfer" class="button button-secondary" type="button" hidden data-i18n="newTransfer">New transfer</button>
                    <button id="retry-transfer" class="button button-danger-soft" type="button" hidden data-i18n="retry">Try again</button>
                    <button id="send-button" class="button button-primary" type="button" disabled>
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 2 11 13"></path>
                            <path d="m22 2-7 20-4-9-9-4Z"></path>
                        </svg>
                        <span id="send-button-label" data-i18n="send">Send files</span>
                    </button>
                </div>
            </div>

            <div id="notice" class="notice" role="alert"></div>
            <p class="footer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
                </svg>
                <span data-i18n="footer">Keep this page open until the transfer finishes.</span>
            </p>
        </section>
    </main>
</div>
</body>
</html>
